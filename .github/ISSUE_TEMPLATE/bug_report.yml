name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: input
    id: repo
    attributes:
      label: Repository or card URL
      placeholder: https://repocard.example.com/card/owner/repo.png?variant=2
  - type: dropdown
    id: surface
    attributes:
      label: Where
      options: [Website, Card URL / API, MCP server, CLI, GitHub Action, Self-hosted]
    validations: { required: true }
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations: { required: true }
  - type: textarea
    id: logs
    attributes:
      label: Output or screenshots
      render: shell
